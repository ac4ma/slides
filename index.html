<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Advanced computing — slides</title>
<style>
  :root { --bg: #ffffff; --fg: #1d1d1f; --muted: #6e6e73; --link: #0b57d0; --line: #e5e5ea; }
  @media (prefers-color-scheme: dark) { :root { --bg: #161618; --fg: #f2f2f7; --muted: #a1a1a6; --link: #8ab4f8; --line: #2c2c2e; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 680px; margin: 0 auto; padding: 48px 16px; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; }
  p.sub { color: var(--muted); margin: 0 0 32px; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { border-top: 1px solid var(--line); padding: 14px 0; }
  li:last-child { border-bottom: 1px solid var(--line); }
  a { color: var(--link); text-decoration: none; font-weight: 600; }
  a:hover { text-decoration: underline; }
  span { display: block; color: var(--muted); font-size: 0.95rem; }
</style>
</head>
<body>
<main>
  <h1>Advanced computing for medical applications</h1>
  <p class="sub">Slides of the exercises. Use the arrow keys to move, and press Esc for the overview.</p>
  <ul>
    <li><a href="exercise-2/">Exercise 2 — From a DICOM CT to Geant4 voxels</a>
      <span>DICOM, Hounsfield units, CT reconstruction from projections, voxels for g4voxel</span></li>
  </ul>
</main>
</body>
</html>
